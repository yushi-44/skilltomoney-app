    /* ==========================================================================
       DESIGN SYSTEM & CSS VARIABLES (스킬투머니 정통 테마 동기화)
       ========================================================================== */
    :root {
      /* Palette: Deep Trust Navy */
      --navy-950: #050b17;
      --navy-900: #0a1326;
      --navy-850: #0f1c35;
      --navy-800: #142444;
      --navy-700: #1d335d;
      --navy-600: #29477e;
      --navy-border: rgba(41, 71, 126, 0.45);
      --navy-glass: rgba(15, 28, 53, 0.72);
      --navy-glass-card: rgba(18, 33, 62, 0.65);
      --navy-hover: rgba(29, 51, 93, 0.85);

      /* Palette: Luxurious Gold */
      --gold-100: #fff9e6;
      --gold-200: #feeebf;
      --gold-300: #fbdc8a;
      --gold-400: #f7c955;
      --gold-500: #e5b331;
      --gold-600: #ca9821;
      --gold-700: #a17417;
      --gold-gradient: linear-gradient(135deg, #fff2cc 0%, #fbdc8a 25%, #e5b331 60%, #b8861b 90%, #8c6411 100%);

      --gold-glow: 0 0 25px rgba(229, 179, 49, 0.3);

      /* Text Colors */
      --text-white: #ffffff;
      --text-gray-100: #f1f5f9;
      --text-gray-300: #cbd5e1;
      --text-gray-400: #94a3b8;
      --text-gray-500: #64748b;

      /* Accents */

      --accent-emerald: #10b981;
      --accent-red: #ef4444;

      /* Shadows & Transitions */
      --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.45);
      --shadow-lg: 0 16px 40px rgba(0, 0, 0, 0.6);
      --shadow-gold: 0 10px 30px rgba(229, 179, 49, 0.25);
      --transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      --font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--navy-950);
      color: var(--text-gray-100);
      font-family: var(--font-family);
      line-height: 1.6;

      display: flex;
      flex-direction: column;

    .empty-row-text {

      flex-direction: column;

      flex-direction: column;

      border-radius: 14px;
      resize: vertical;
      outline: none;
      tab-size: 4;
      transition: var(--transition);
    }

    #codeEditor:focus {
      border-color: var(--gold-400);
      box-shadow: 0 0 15px rgba(229, 179, 49, 0.25);
    }

    /* 오류 안내 영역 */
    #errorBox {

      color: var(--text-gray-500);
    }
  </style>
</head>

  <!-- ==========================================================================
       실습실 동작 스크립트 (input() 매핑, print() 출력, row 표 누적 추가, ch06_lab.ipynb)
       ========================================================================== -->
  <script>
    // 6장 처음 파이썬 코드
    const INITIAL_CODE = `import json
prices = {"AI 자동화": 35000, "숏폼 편집": 45000, "엑셀 실무": 30000}
rsv = {"date": "2026-11-07", "course": "AI 자동화", "name": input("이름: "), "phone": "010-1111-2222", "people": int(input("인원: "))}
rsv["total"] = prices[rsv["course"]] * rsv["people"]
text = json.dumps(rsv, ensure_ascii=False)
print("보내는 JSON:", text)

data = json.loads(text)
keys = ["date", "course", "name", "phone", "people", "total"]
row = []
for i in range(0, len(keys), 1):
    row.append(data[keys[i]])
print("시트에 추가되는 행:", row)`;

    const codeEditor = document.getElementById("codeEditor");
    const nameInput = document.getElementById("nameInput");
    const peopleInput = document.getElementById("peopleInput");
    const btnSubmit = document.getElementById("btnSubmit");
    const btnRun = document.getElementById("btnRun");
    const btnReset = document.getElementById("btnReset");
    const btnDownload = document.getElementById("btnDownload");
    const outputResult = document.getElementById("outputResult");
    const sheetTableBody = document.getElementById("sheetTableBody");
    const sheetRowCount = document.getElementById("sheetRowCount");
    const errorBox = document.getElementById("errorBox");
    const errorMessage = document.getElementById("errorMessage");

    codeEditor.value = INITIAL_CODE;

    // input() 호출 카운터 & print() 버퍼
    let inputCallCount = 0;
    let printOutputBuffer = [];
    let savedRowCount = 0;

    function outf(text) {
      if (text) {
        printOutputBuffer.push(text);
      }
    }

    function builtinRead(x) {
      if (x === "src/lib/json.py" || x === "./json.py") {
        return `import _json_bridge

def dumps(obj, *args, **kwargs):
    return _json_bridge.dumps(obj)

def loads(s, *args, **kwargs):
    return _json_bridge.loads(s)
`;
      }
      if (x === "src/lib/_json_bridge.js" || x === "./_json_bridge.js") {
        return `var $builtinmodule = function(name) {
    var mod = {};
    mod.__name__ = new Sk.builtin.str("_json_bridge");
    mod.dumps = new Sk.builtin.func(function(obj) {
        var jsObj = Sk.ffi.remapToJs(obj);
        return new Sk.builtin.str(JSON.stringify(jsObj));
    });
    mod.loads = new Sk.builtin.func(function(s) {
        var jsStr = Sk.ffi.remapToJs(s);
        var parsed = JSON.parse(jsStr);
        return Sk.ffi.remapToPy(parsed);
    });
    return mod;
};`;
      }
      if (Sk.builtinFiles === undefined || Sk.builtinFiles["files"][x] === undefined) {
        throw "File not found: '" + x + "'";
      }
      return Sk.builtinFiles["files"][x];
    }

    // input(): 첫 번째 input()은 이름 칸, 두 번째 input()은 인원 칸의 값을 돌려줌
    function inputfun(promptText) {
      inputCallCount++;
      if (inputCallCount === 1) {
        return nameInput.value || "홍길동";
      } else {
        return peopleInput.value || "1";
      }
    }

    // "구글 시트 · 예약" 표의 맨 아래에 한 행 추가
    function appendRowToSheetTable(rowData) {
      // emptyRow 제거
      const emptyRow = document.getElementById("emptyRow");
      if (emptyRow) {
        emptyRow.remove();
      }

      const tr = document.createElement("tr");

      // row 구조: [date, course, name, phone, people, total]
      const dateVal = rowData[0] !== undefined ? rowData[0] : "";
      const courseVal = rowData[1] !== undefined ? rowData[1] : "";
      const nameVal = rowData[2] !== undefined ? rowData[2] : "";
      const phoneVal = rowData[3] !== undefined ? rowData[3] : "";
      const peopleVal = rowData[4] !== undefined ? rowData[4] + "명" : "";
      const totalVal = rowData[5] !== undefined ? Number(rowData[5]).toLocaleString() + "원" : "";

      tr.innerHTML = `
        <td style="color: var(--text-gray-400);">${dateVal}</td>
        <td style="font-weight: 700; color: #fff;">${courseVal}</td>
        <td style="font-weight: 800; color: var(--gold-300);">${nameVal}</td>
        <td style="color: var(--text-gray-300);">${phoneVal}</td>
        <td style="color: var(--accent-cyan); font-weight: 700;">${peopleVal}</td>
        <td style="font-weight: 800; color: var(--gold-400);">${totalVal}</td>
      `;

      sheetTableBody.appendChild(tr);

      savedRowCount++;
      sheetRowCount.textContent = `총 ${savedRowCount}건 저장됨`;
    }

    function showError(err) {
      errorBox.style.display = "block";
      errorMessage.textContent = err.toString();
    }

    // 파이썬 실행
    function runPython() {
      inputCallCount = 0;
      printOutputBuffer = [];
      errorBox.style.display = "none";

      const prog = codeEditor.value;

      if (typeof Sk !== "undefined") {
        if (!Sk.builtinFiles) Sk.builtinFiles = { files: {} };
        if (!Sk.builtinFiles.files) Sk.builtinFiles.files = {};
        Sk.builtinFiles.files["src/lib/json.py"] = `import _json_bridge\n\ndef dumps(obj, *args, **kwargs):\n    return _json_bridge.dumps(obj)\n\ndef loads(s, *args, **kwargs):\n    return _json_bridge.loads(s)\n`;
        Sk.builtinFiles.files["src/lib/_json_bridge.js"] = `var $builtinmodule = function(name) {\n    var mod = {};\n    mod.__name__ = new Sk.builtin.str("_json_bridge");\n    mod.dumps = new Sk.builtin.func(function(obj) {\n        var jsObj = Sk.ffi.remapToJs(obj);\n        return new Sk.builtin.str(JSON.stringify(jsObj));\n    });\n    mod.loads = new Sk.builtin.func(function(s) {\n        var jsStr = Sk.ffi.remapToJs(s);\n        var parsed = JSON.parse(jsStr);\n        return Sk.ffi.remapToPy(parsed);\n    });\n    return mod;\n};`;

        Sk.pre = "output";
        Sk.configure({
          output: outf,
          read: builtinRead,
          inputfun: inputfun,
          inputfunTakesPrompt: true,
          __future__: Sk.python3
        });

        const myPromise = Sk.misceval.asyncToPromise(function () {
          return Sk.importMainWithBody("<stdin>", false, prog, true);
        });

        myPromise.then(
          function () {
            // 1. print() 내용 출력
            outputResult.textContent = printOutputBuffer.join("");

            // 2. row 리스트를 표에 추가
            let rowList = null;
            try {
              if (Sk.globals && Sk.globals["row"] !== undefined) {
                rowList = Sk.ffi.remapToJs(Sk.globals["row"]);
              }
            } catch (e) {
              console.error(e);
            }

            if (Array.isArray(rowList) && rowList.length > 0) {
              appendRowToSheetTable(rowList);
            }
          },
          function (err) {
            showError(err);
            // Skulpt 내장 json 모듈 에러 등 발생 시 폴백 인터프리터 실행
            runFallback(prog);
          }
        );
      } else {
        runFallback(prog);
      }
    }

    // 순수 JS 파이썬 시뮬레이터 (오프라인 환경 / Skulpt 미지원 환경 대응)
    function runFallback(code) {
      try {
        const prices = { "AI 자동화": 35000, "숏폼 편집": 45000, "엑셀 실무": 30000 };
        const nameVal = nameInput.value || "홍길동";
        const peopleVal = parseInt(peopleInput.value, 10) || 1;
        const courseVal = "AI 자동화";
        const dateVal = "2026-11-07";
        const phoneVal = "010-1111-2222";
        const totalVal = (prices[courseVal] || 35000) * peopleVal;

        const rsv = {
          date: dateVal,
          course: courseVal,
          name: nameVal,
          phone: phoneVal,
          people: peopleVal,
          total: totalVal
        };

        const text = JSON.stringify(rsv);
        const row = [dateVal, courseVal, nameVal, phoneVal, peopleVal, totalVal];

        outputResult.textContent = `보내는 JSON: ${text}\n시트에 추가되는 행: ${JSON.stringify(row).replace(/"/g, "'")}`;
        appendRowToSheetTable(row);
      } catch (e) {
        showError(e);
      }
    }

    // [신청] 버튼 누를 때마다 실행되어 표에 행이 누적됨
    btnSubmit.addEventListener("click", () => {
      runPython();
    });

    // [▶ 코드 실행하기] 버튼
    btnRun.addEventListener("click", () => {
      runPython();
    });

    // [처음 코드로] 버튼
    btnReset.addEventListener("click", () => {
      codeEditor.value = INITIAL_CODE;
      outputResult.textContent = "코드를 실행하면 결과가 여기에 표시됩니다.";
      errorBox.style.display = "none";
    });

    // [⬇ 코랩 노트북으로 받기] -> ch06_lab.ipynb
    btnDownload.addEventListener("click", () => {
      const code = codeEditor.value;
      const notebookData = {
        cells: [
          {
            cell_type: "markdown",
            metadata: {},
            source: [
              "# 스킬투머니 실습실 · 6장\n",
              "JSON 변환과 구글 시트 행 추가 실습\n"
            ]
          },
          {
            cell_type: "code",
            execution_count: null,
            metadata: {},
            outputs: [],
            source: code.split("\n").map(line => line + "\n")
          }
        ],
        metadata: {
          colab: {
            name: "ch06_lab.ipynb",
            provenance: []
          },
          kernelspec: {
            display_name: "Python 3",
            name: "python3"
          },
          language_info: {
            name: "python"
          }
        },
        nbformat: 4,
        nbformat_minor: 0
      };

      const blob = new Blob([JSON.stringify(notebookData, null, 2)], {
        type: "application/json"
      });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "ch06_lab.ipynb";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });

    // 페이지를 열면 코드를 한 번 실행
    window.addEventListener("DOMContentLoaded", () => {
      runPython();
    });
  </script>
</body>
