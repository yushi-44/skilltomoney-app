<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스킬투머니 실습실 · 5장</title>
  <meta name="description" content="스킬투머니 실습실 5장 - 딕셔너리와 필터링 조건문 실습">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800;900&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- Skulpt 파이썬 브라우저 실행 엔진 -->
  <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt-stdlib.js"></script>
  <style>
    /* ==========================================================================
       DESIGN SYSTEM & CSS VARIABLES (스킬투머니 정통 테마 동기화)
       ========================================================================== */
    :root {
      /* Palette: Deep Trust Navy */
      --navy-950: #050b17;
      --navy-900: #0a1326;
      --navy-850: #0f1c35;
      --navy-800: #142444;
      --navy-700: #1d335d;
      --navy-600: #29477e;
      --navy-border: rgba(41, 71, 126, 0.45);
      --navy-glass: rgba(15, 28, 53, 0.72);
      --navy-glass-card: rgba(18, 33, 62, 0.65);
      --navy-hover: rgba(29, 51, 93, 0.85);

      /* Palette: Luxurious Gold */
      --gold-100: #fff9e6;
      --gold-200: #feeebf;
      --gold-300: #fbdc8a;
      --gold-400: #f7c955;
      --gold-500: #e5b331;
      --gold-600: #ca9821;
      --gold-700: #a17417;
      --gold-gradient: linear-gradient(135deg, #fff2cc 0%, #fbdc8a 25%, #e5b331 60%, #b8861b 90%, #8c6411 100%);
      --gold-gradient-glow: linear-gradient(135deg, #f7c955 0%, #e5b331 50%, #b8861b 100%);
      --gold-border: rgba(229, 179, 49, 0.35);
      --gold-glow: 0 0 25px rgba(229, 179, 49, 0.3);

      /* Text Colors */
      --text-white: #ffffff;
      --text-gray-100: #f1f5f9;
      --text-gray-300: #cbd5e1;
      --text-gray-400: #94a3b8;
      --text-gray-500: #64748b;

      /* Accents */
      --accent-cyan: #38bdf8;
      --accent-emerald: #10b981;
      --accent-red: #ef4444;

      /* Shadows & Transitions */
      --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.45);
      --shadow-lg: 0 16px 40px rgba(0, 0, 0, 0.6);
      --shadow-gold: 0 10px 30px rgba(229, 179, 49, 0.25);
      --transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      --font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--navy-950);
      color: var(--text-gray-100);
      font-family: var(--font-family);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-image: 
        radial-gradient(circle at 15% 10%, rgba(229, 179, 49, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 85% 30%, rgba(56, 189, 248, 0.07) 0%, transparent 45%),
        radial-gradient(circle at 50% 75%, rgba(20, 36, 68, 0.8) 0%, transparent 60%);
      background-attachment: fixed;
    }

    /* ==========================================================================
       TOP NAVIGATION BAR (맨 위 제목 띠: 스킬투머니 실습실 · 5장)
       ========================================================================== */
    .lab-header {
      background: rgba(10, 19, 38, 0.9);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--navy-border);
      padding: 14px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo-symbol {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: linear-gradient(135deg, #1b3054, #0b1528);
      border: 1.5px solid var(--gold-400);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 15px rgba(229, 179, 49, 0.35);
    }

    .lab-title-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .lab-title {
      font-size: 1.35rem;
      font-weight: 900;
      letter-spacing: -0.02em;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline-block;
      filter: drop-shadow(0 2px 8px rgba(229, 179, 49, 0.25));
    }

    .chapter-tag {
      font-size: 0.8rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 9999px;
      background: rgba(229, 179, 49, 0.12);
      border: 1px solid var(--gold-border);
      color: var(--gold-300);
      backdrop-filter: blur(8px);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn {
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 700;
      padding: 10px 18px;
      border-radius: 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: none;
      transition: var(--transition);
      text-decoration: none;
      white-space: nowrap;
    }

    .btn-navy-outline {
      background: var(--navy-glass);
      color: var(--text-gray-100);
      border: 1px solid var(--navy-border);
      backdrop-filter: blur(10px);
    }
    .btn-navy-outline:hover {
      background: var(--navy-hover);
      border-color: var(--gold-border);
      color: var(--gold-200);
      transform: translateY(-2px);
    }

    .btn-gold {
      background: var(--gold-gradient-glow);
      color: #1a1200;
      box-shadow: var(--shadow-gold);
    }
    .btn-gold:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 35px rgba(229, 179, 49, 0.45);
      filter: brightness(1.08);
    }

    .btn-refresh {
      background: linear-gradient(135deg, #1f3764 0%, #11213d 100%);
      color: #fbdc8a;
      border: 1px solid var(--gold-border);
      padding: 8px 16px;
      font-size: 0.85rem;
    }
    .btn-refresh:hover {
      background: linear-gradient(135deg, #2a4882 0%, #172c50 100%);
      border-color: var(--gold-400);
      transform: translateY(-1px);
    }

    /* ==========================================================================
       MAIN LAB WORKSPACE (왼쪽 웹앱 화면 + 오른쪽 코드 칸)
       ========================================================================== */
    .lab-workspace {
      flex: 1;
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      gap: 24px;
      padding: 24px 28px;
      max-width: 1540px;
      width: 100%;
      margin: 0 auto;
    }

    @media (max-width: 1024px) {
      .lab-workspace {
        grid-template-columns: 1fr;
        padding: 16px;
      }
    }

    /* 공통 패널 */
    .panel {
      background: var(--navy-glass-card);
      border: 1px solid var(--navy-border);
      border-radius: 22px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      backdrop-filter: blur(16px);
      box-shadow: var(--shadow-lg);
      position: relative;
    }

    .panel-header {
      background: rgba(10, 19, 38, 0.75);
      border-bottom: 1px solid var(--navy-border);
      padding: 16px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .panel-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--text-white);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .panel-title-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--gold-400);
      box-shadow: 0 0 10px rgba(229, 179, 49, 0.6);
    }

    .panel-body {
      padding: 22px;
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    /* ==========================================================================
       LEFT: 웹앱 화면 (원데이 강좌 목록 + 체크 상자)
       ========================================================================== */
    .webapp-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(10, 19, 38, 0.7);
      border: 1px solid var(--navy-border);
      border-radius: 14px;
      padding: 12px 18px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }

    /* 예약 가능한 강좌만 보기 체크 상자 (직접 누를 수는 없게 disabled) */
    .checkbox-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--text-gray-200);
      user-select: none;
      cursor: not-allowed;
    }

    .checkbox-wrap input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--gold-400);
      cursor: not-allowed;
    }

    .code-indicator {
      font-size: 0.75rem;
      color: var(--gold-300);
      background: rgba(229, 179, 49, 0.12);
      border: 1px solid rgba(229, 179, 49, 0.3);
      padding: 2px 8px;
      border-radius: 9999px;
      font-weight: 600;
    }

    /* 강좌 카드가 쌓이는 자리 */
    #cardsContainer {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .course-card {
      background: linear-gradient(145deg, rgba(20, 36, 68, 0.85) 0%, rgba(13, 24, 46, 0.95) 100%);
      border: 1px solid var(--navy-border);
      border-radius: 16px;
      padding: 20px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      transition: var(--transition);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
    }

    .course-card:hover {
      border-color: var(--gold-border);
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.4), 0 0 15px rgba(229, 179, 49, 0.12);
    }

    .course-card.closed-card {
      opacity: 0.75;
      border-color: rgba(71, 85, 105, 0.5);
    }

    .course-info {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* 강좌 이름: 굵게 (요구사항) */
    .course-name {
      font-size: 1.25rem;
      font-weight: 900;
      color: var(--text-white);
      letter-spacing: -0.015em;
    }

    /* 태그 목록 배지 */
    .course-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 2px 0 4px;
    }

    .course-tag-item {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--gold-300);
      background: rgba(229, 179, 49, 0.1);
      border: 1px solid rgba(229, 179, 49, 0.25);
      padding: 2px 8px;
      border-radius: 6px;
    }

    .course-meta {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 0.92rem;
      color: var(--text-gray-300);
      flex-wrap: wrap;
    }

    .course-price {
      color: var(--gold-300);
      font-weight: 800;
      font-size: 1.05rem;
    }

    .course-seats {
      color: var(--text-gray-300);
      font-weight: 600;
    }

    /* 상태 뱃지 규격 */
    .badge-closed {
      background: #334155;
      color: #94a3b8;
      font-size: 0.85rem;
      font-weight: 800;
      padding: 6px 14px;
      border-radius: 8px;
      border: 1px solid #475569;
      white-space: nowrap;
    }

    .badge-imminent {
      background: rgba(239, 68, 68, 0.16);
      color: #ef4444;
      font-size: 0.85rem;
      font-weight: 900;
      padding: 6px 14px;
      border-radius: 8px;
      border: 1px solid rgba(239, 68, 68, 0.45);
      animation: pulse 1.5s infinite;
      white-space: nowrap;
    }

    .badge-open {
      background: rgba(16, 185, 129, 0.16);
      color: #34d399;
      font-size: 0.85rem;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 8px;
      border: 1px solid rgba(16, 185, 129, 0.4);
      white-space: nowrap;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.65; }
    }

    /* ==========================================================================
       RIGHT: 코드 칸 (파이썬 코드 편집 및 실행)
       ========================================================================== */
    .editor-wrapper {
      display: flex;
      flex-direction: column;
      flex: 1;
      height: 100%;
    }

    .editor-container {
      position: relative;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    #codeEditor {
      width: 100%;
      flex: 1;
      min-height: 420px;
      background: #060d1b;
      color: #f8fafc;
      font-family: 'Fira Code', 'Consolas', monospace;
      font-size: 0.95rem;
      line-height: 1.65;
      padding: 18px;
      border: 1px solid rgba(41, 71, 126, 0.6);
      border-radius: 14px;
      resize: vertical;
      outline: none;
      tab-size: 4;
      transition: var(--transition);
    }

    #codeEditor:focus {
      border-color: var(--gold-400);
      box-shadow: 0 0 15px rgba(229, 179, 49, 0.25);
    }

    /* 오류 안내 영역 */
    #errorBox {
      display: none;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.4);
      border-radius: 12px;
      padding: 16px 20px;
      margin-top: 16px;
      color: #fca5a5;
      font-size: 0.9rem;
      line-height: 1.6;
      animation: errorFade 0.2s ease forwards;
    }

    #errorBox strong {
      color: #ef4444;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
      font-size: 0.98rem;
    }

    @keyframes errorFade {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 푸터 */
    .lab-footer {
      background: #030812;
      border-top: 1px solid var(--navy-border);
      padding: 18px 24px;
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-gray-500);
    }
  </style>
</head>
<body>

  <!-- 맨 위 제목 띠: "스킬투머니 실습실 · 5장" -->
  <header class="lab-header">
    <div class="brand-group">
      <div class="logo-symbol">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="url(#goldGrad)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
          <defs>
            <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#fff2cc" />
              <stop offset="50%" stop-color="#e5b331" />
              <stop offset="100%" stop-color="#8c6411" />
            </linearGradient>
          </defs>
          <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6" />
        </svg>
      </div>
      <div class="lab-title-wrap">
        <h1 class="lab-title">스킬투머니 실습실 · 5장</h1>
        <span class="chapter-tag">딕셔너리와 필터링 실습</span>
      </div>
    </div>

    <!-- 헤더 우측: [처음 코드로], [⬇ 코랩 노트북으로 받기] -->
    <div class="header-actions">
      <button type="button" class="btn btn-navy-outline" id="btnReset">처음 코드로</button>
      <button type="button" class="btn btn-gold" id="btnDownload">⬇ 코랩 노트북으로 받기</button>
    </div>
  </header>

  <!-- 실습실 본문 (2열 분할 레이아웃) -->
  <main class="lab-workspace">
    <!-- 왼쪽 웹앱 화면 -->
    <section class="panel">
      <div class="panel-header">
        <div class="panel-title">
          <span class="panel-title-dot"></span>
          원데이 강좌 목록
        </div>
        <button type="button" class="btn btn-refresh" id="btnRefresh">
          🔄 목록 새로 고침
        </button>
      </div>
      <div class="panel-body">
        <!-- 체크 상자 (직접 누를 수는 없게 disabled) -->
        <div class="webapp-controls">
          <label class="checkbox-wrap" title="파이썬 코드의 only_open 변수에 의해 자동으로 조작됩니다.">
            <input type="checkbox" id="onlyOpenCheckbox" disabled>
            <span>예약 가능한 강좌만 보기</span>
          </label>
          <span class="code-indicator">코드 only_open 연동</span>
        </div>

        <!-- 카드가 쌓이는 자리 -->
        <div id="cardsContainer">
          <!-- print() 실행 결과가 카드로 동적 렌더링됩니다 -->
        </div>
      </div>
    </section>

    <!-- 오른쪽 코드 칸 -->
    <section class="panel">
      <div class="panel-header">
        <div class="panel-title">
          <span class="panel-title-dot"></span>
          파이썬 코드 (Python)
        </div>
        <button type="button" class="btn btn-gold" id="btnRun">
          ▶ 코드 실행하기
        </button>
      </div>
      <div class="panel-body editor-wrapper">
        <div class="editor-container">
          <textarea id="codeEditor" spellcheck="false"></textarea>
        </div>

        <!-- 오류 안내 영역 -->
        <div id="errorBox">
          <strong>⚠️ 파이썬 오류 안내</strong>
          <div id="errorMessage"></div>
        </div>
      </div>
    </section>
  </main>

  <!-- 하단 안내 푸터 -->
  <footer class="lab-footer">
    © 2026 스킬투머니 (SkillToMoney) · 배운 기술을 돈으로 바꾸는 실전 파이썬 실습실
  </footer>

  <!-- ==========================================================================
       실습실 동작 스크립트 (Skulpt 엔진 + only_open 동기화 + ch05_lab.ipynb)
       ========================================================================== -->
  <script>
    // 오른쪽 코드 칸의 처음 코드 (요청하신 5장 초기 코드)
    const INITIAL_CODE = `courses = [
    {"id": 1, "name": "AI 자동화", "price": 35000, "seat": 8, "booked": 8, "tags": ["초보 환영", "2시간"]},
    {"id": 2, "name": "숏폼 편집", "price": 45000, "seat": 6, "booked": 2, "tags": ["캡컷", "3시간"]},
    {"id": 3, "name": "엑셀 실무", "price": 30000, "seat": 10, "booked": 7, "tags": ["함수 실습"]},
    {"id": 4, "name": "스마트스토어", "price": 40000, "seat": 6, "booked": 5, "tags": ["상세페이지", "창업 준비"]}
]
only_open = True
for i in range(0, len(courses), 1):
    c = courses[i]
    left = c["seat"] - c["booked"]
    if only_open and left == 0:
        continue
    print(c["name"], c["price"], "원 / 남은 자리", left, "석", c["tags"])`;

    const codeEditor = document.getElementById("codeEditor");
    const cardsContainer = document.getElementById("cardsContainer");
    const onlyOpenCheckbox = document.getElementById("onlyOpenCheckbox");
    const errorBox = document.getElementById("errorBox");
    const errorMessage = document.getElementById("errorMessage");
    const btnReset = document.getElementById("btnReset");
    const btnDownload = document.getElementById("btnDownload");
    const btnRun = document.getElementById("btnRun");
    const btnRefresh = document.getElementById("btnRefresh");

    // 초기 코드 주입
    codeEditor.value = INITIAL_CODE;

    // 파이썬 print() 버퍼
    let printOutputLines = [];

    function outf(text) {
      if (text && text.trim().length > 0) {
        printOutputLines.push(text.trim());
      }
    }

    function builtinRead(x) {
      if (Sk.builtinFiles === undefined || Sk.builtinFiles["files"][x] === undefined) {
        throw "File not found: '" + x + "'";
      }
      return Sk.builtinFiles["files"][x];
    }

    // print() 한 줄을 강좌 카드 한 장으로 렌더링
    // 출력 형태 예시: "숏폼 편집 45000 원 / 남은 자리 4 석 ['캡컷', '3시간']"
    function renderCardFromLine(line) {
      const card = document.createElement("div");
      card.className = "course-card";

      let courseName = "";
      let priceText = "";
      let leftSeats = 0;
      let tagsList = [];

      // 1. 태그 추출 (대괄호 [ ... ] 내부)
      const tagsMatch = line.match(/\[(.*?)\]/);
      if (tagsMatch) {
        // "'캡컷', '3시간'" 파싱
        const rawTags = tagsMatch[1];
        tagsList = rawTags
          .split(",")
          .map(t => t.replace(/['"\[\]]/g, "").trim())
          .filter(t => t.length > 0);
      }

      // 태그 제거한 본문
      const withoutTags = line.replace(/\[.*?\]/, "").trim();

      // 2. 강좌 이름, 수강료, 남은 자리 분리 ("원 / 남은 자리" 기준)
      const wonIndex = withoutTags.indexOf("원");
      if (wonIndex !== -1) {
        const front = withoutTags.substring(0, wonIndex).trim(); // "숏폼 편집 45000"
        const back = withoutTags.substring(wonIndex).trim();      // "원 / 남은 자리 4 석"

        const lastSpace = front.lastIndexOf(" ");
        if (lastSpace !== -1) {
          courseName = front.substring(0, lastSpace).trim();
          const rawPrice = front.substring(lastSpace + 1).trim();
          const numPrice = Number(rawPrice);
          priceText = isNaN(numPrice) ? rawPrice + "원" : numPrice.toLocaleString() + "원";
        } else {
          courseName = front;
        }

        // 남은 자리 숫자 추출
        const seatMatch = back.match(/(\d+)\s*석/);
        if (seatMatch) {
          leftSeats = parseInt(seatMatch[1], 10);
        }
      } else {
        courseName = withoutTags;
      }

      const isClosed = leftSeats <= 0;
      const isImminent = leftSeats >= 1 && leftSeats <= 3;

      if (isClosed) {
        card.classList.add("closed-card");
      }

      // 상태 뱃지
      let badgeHtml = "";
      if (isClosed) {
        badgeHtml = `<span class="badge-closed">마감</span>`;
      } else if (isImminent) {
        badgeHtml = `<span class="badge-imminent">마감 임박</span>`;
      } else {
        badgeHtml = `<span class="badge-open">모집중</span>`;
      }

      // 태그 HTML
      const tagsHtml = tagsList
        .map(tag => `<span class="course-tag-item">#${tag}</span>`)
        .join("");

      card.innerHTML = `
        <div class="course-info">
          <!-- 줄의 맨 앞 강좌 이름은 굵게 -->
          <div class="course-name">${courseName}</div>
          ${tagsList.length > 0 ? `<div class="course-tags">${tagsHtml}</div>` : ""}
          <div class="course-meta">
            ${priceText ? `<span class="course-price">${priceText}</span>` : ""}
            <span class="course-seats">남은 자리 ${leftSeats}석</span>
          </div>
        </div>
        <div class="course-action">
          ${badgeHtml}
        </div>
      `;

      cardsContainer.appendChild(card);
    }

    // 오류 표시 함수
    function showError(err) {
      errorBox.style.display = "block";
      errorMessage.textContent = err.toString();
    }

    // 코드 실행 완료 후 only_open 변수 동기화
    function syncOnlyOpenCheckbox(prog) {
      let isOnlyOpen = false;
      try {
        if (typeof Sk !== "undefined" && Sk.globals && Sk.globals["only_open"] !== undefined) {
          isOnlyOpen = Sk.ffi.remapToJs(Sk.globals["only_open"]) === true;
        } else {
          const match = prog.match(/only_open\s*=\s*(True|False)/);
          if (match) isOnlyOpen = match[1] === "True";
        }
      } catch (e) {
        const match = prog.match(/only_open\s*=\s*(True|False)/);
        if (match) isOnlyOpen = match[1] === "True";
      }

      // 체크 상자 업데이트
      onlyOpenCheckbox.checked = isOnlyOpen;
    }

    // 파이썬 실행 메인 함수
    function runPython() {
      printOutputLines = [];
      cardsContainer.innerHTML = "";
      errorBox.style.display = "none";

      const prog = codeEditor.value;

      if (typeof Sk !== "undefined") {
        Sk.pre = "output";
        Sk.configure({
          output: outf,
          read: builtinRead,
          __future__: Sk.python3
        });

        const myPromise = Sk.misceval.asyncToPromise(function () {
          return Sk.importMainWithBody("<stdin>", false, prog, true);
        });

        myPromise.then(
          function () {
            // print()로 출력된 라인들을 카드로 렌더링
            if (printOutputLines.length === 0) {
              cardsContainer.innerHTML = `<div style="text-align: center; color: var(--text-gray-400); padding: 40px;">출력된 강좌 카드가 없습니다. (조건에 맞는 강좌가 없거나 print문 확인)</div>`;
            } else {
              printOutputLines.forEach(line => renderCardFromLine(line));
            }
            // 실행 종료 후 only_open 값에 따라 체크 상자 상태 변경
            syncOnlyOpenCheckbox(prog);
          },
          function (err) {
            showError(err);
            syncOnlyOpenCheckbox(prog);
          }
        );
      } else {
        // 안전 폴백 인터프리터
        runFallbackInterpreter(prog);
      }
    }

    // 순수 JS 파이썬 시뮬레이터 (오프라인 환경 대응 폴백)
    function runFallbackInterpreter(code) {
      try {
        const onlyOpenMatch = code.match(/only_open\s*=\s*(True|False)/);
        const isOnlyOpen = onlyOpenMatch ? onlyOpenMatch[1] === "True" : true;
        onlyOpenCheckbox.checked = isOnlyOpen;

        const defaultCourses = [
          { id: 1, name: "AI 자동화", price: 35000, seat: 8, booked: 8, tags: ["초보 환영", "2시간"] },
          { id: 2, name: "숏폼 편집", price: 45000, seat: 6, booked: 2, tags: ["캡컷", "3시간"] },
          { id: 3, name: "엑셀 실무", price: 30000, seat: 10, booked: 7, tags: ["함수 실습"] },
          { id: 4, name: "스마트스토어", price: 40000, seat: 6, booked: 5, tags: ["상세페이지", "창업 준비"] }
        ];

        cardsContainer.innerHTML = "";
        for (let i = 0; i < defaultCourses.length; i++) {
          const c = defaultCourses[i];
          const left = c.seat - c.booked;
          if (isOnlyOpen && left === 0) {
            continue;
          }
          const outputLine = `${c.name} ${c.price} 원 / 남은 자리 ${left} 석 ${JSON.stringify(c.tags).replace(/"/g, "'")}`;
          renderCardFromLine(outputLine);
        }
      } catch (err) {
        showError(err);
      }
    }

    // [처음 코드로] 버튼 이벤트
    btnReset.addEventListener("click", () => {
      codeEditor.value = INITIAL_CODE;
      runPython();
    });

    // [코드 실행하기] & [목록 새로 고침] 이벤트
    btnRun.addEventListener("click", runPython);
    btnRefresh.addEventListener("click", runPython);

    // [⬇ 코랩 노트북으로 받기] -> 파일명 ch05_lab.ipynb
    btnDownload.addEventListener("click", () => {
      const code = codeEditor.value;
      const notebookData = {
        cells: [
          {
            cell_type: "markdown",
            metadata: {},
            source: [
              "# 스킬투머니 실습실 · 5장\n",
              "딕셔너리와 필터링 조건문 실습\n"
            ]
          },
          {
            cell_type: "code",
            execution_count: null,
            metadata: {},
            outputs: [],
            source: code.split("\n").map(line => line + "\n")
          }
        ],
        metadata: {
          colab: {
            name: "ch05_lab.ipynb",
            provenance: []
          },
          kernelspec: {
            display_name: "Python 3",
            name: "python3"
          },
          language_info: {
            name: "python"
          }
        },
        nbformat: 4,
        nbformat_minor: 0
      };

      const blob = new Blob([JSON.stringify(notebookData, null, 2)], {
        type: "application/json"
      });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "ch05_lab.ipynb";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });

    // 페이지를 열면 코드를 한 번 실행해 카드를 그려 줌
    window.addEventListener("DOMContentLoaded", () => {
      runPython();
    });
  </script>
