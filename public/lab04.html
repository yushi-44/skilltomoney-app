<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스킬투머니 실습실 · 4장</title>
  <meta name="description" content="스킬투머니 실습실 4장 - 배운 기술이 돈이 되는 파이썬 원데이 강좌 목록 반복문 실습">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800;900&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- Skulpt 파이썬 브라우저 실행 엔진 -->
  <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt-stdlib.js"></script>
  <style>
    /* ==========================================================================
       DESIGN SYSTEM & CSS VARIABLES (첨부된 스킬투머니 테마 완벽 동기화)
       ========================================================================== */
    :root {
      /* Palette: Deep Trust Navy */
      --navy-950: #050b17;
      --navy-900: #0a1326;
      --navy-850: #0f1c35;
      --navy-800: #142444;
      --navy-700: #1d335d;
      --navy-600: #29477e;
      --navy-border: rgba(41, 71, 126, 0.45);
      --navy-glass: rgba(15, 28, 53, 0.72);
      --navy-glass-card: rgba(18, 33, 62, 0.65);
      --navy-hover: rgba(29, 51, 93, 0.85);

      /* Palette: Luxurious Gold */
      --gold-100: #fff9e6;
      --gold-200: #feeebf;
      --gold-300: #fbdc8a;
      --gold-400: #f7c955;
      --gold-500: #e5b331;
      --gold-600: #ca9821;
      --gold-700: #a17417;
      --gold-gradient: linear-gradient(135deg, #fff2cc 0%, #fbdc8a 25%, #e5b331 60%, #b8861b 90%, #8c6411 100%);
      --gold-gradient-glow: linear-gradient(135deg, #f7c955 0%, #e5b331 50%, #b8861b 100%);
      --gold-border: rgba(229, 179, 49, 0.35);
      --gold-glow: 0 0 25px rgba(229, 179, 49, 0.3);

      /* Text Colors */
      --text-white: #ffffff;
      --text-gray-100: #f1f5f9;
      --text-gray-300: #cbd5e1;
      --text-gray-400: #94a3b8;
      --text-gray-500: #64748b;

      /* Accents */
      --accent-cyan: #38bdf8;
      --accent-emerald: #10b981;
      --accent-red: #ef4444;

      /* Shadows & Transitions */
      --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.45);
      --shadow-lg: 0 16px 40px rgba(0, 0, 0, 0.6);
      --shadow-gold: 0 10px 30px rgba(229, 179, 49, 0.25);
      --transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      --font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--navy-950);
      color: var(--text-gray-100);

      line-height: 1.6;

      display: flex;
      flex-direction: column;

        radial-gradient(circle at 85% 30%, rgba(56, 189, 248, 0.07) 0%, transparent 45%),

      background-attachment: fixed;
    }

    /* ==========================================================================
       TOP NAVIGATION BAR (맨 위 제목 띠: 스킬투머니 실습실 · 4장)
       ========================================================================== */
    .lab-header {
      background: rgba(10, 19, 38, 0.9);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--navy-border);
      padding: 14px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .brand-group {

      align-items: center;

    .logo-symbol {

    }

    .lab-title {

      background: var(--gold-gradient);

    /* ==========================================================================
       MAIN LAB WORKSPACE (왼쪽 웹앱 화면 + 오른쪽 코드 칸)
       ========================================================================== */
    .lab-workspace {
      flex: 1;

      overflow: hidden;
      backdrop-filter: blur(16px);

    .panel-header {
      background: rgba(10, 19, 38, 0.75);
      border-bottom: 1px solid var(--navy-border);
      padding: 16px 22px;
      display: flex;

    }

    .panel-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--text-white);
      display: flex;

    .panel-body {

    /* ==========================================================================

    /* 강좌 카드가 쌓이는 자리 */
    #cardsContainer {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .course-card {
      background: linear-gradient(145deg, rgba(20, 36, 68, 0.85) 0%, rgba(13, 24, 46, 0.95) 100%);
      border: 1px solid var(--navy-border);

      padding: 20px 22px;

      letter-spacing: -0.015em;
    }

    .course-meta {

      font-size: 0.95rem;
      color: var(--text-gray-300);

    }

    .course-price {

      font-size: 1.05rem;
    }

    .course-seats {
      color: var(--text-gray-300);
    }

    /* 상태 뱃지 규격 */
    /* [마감]: 회색 마감 표시 */
    .badge-closed {
      background: #334155;
      color: #94a3b8;
      font-size: 0.85rem;
      font-weight: 800;
      padding: 6px 14px;
      border-radius: 8px;
      border: 1px solid #475569;
      white-space: nowrap;
    }

    /* [마감 임박]: 빨간 글씨 표시 */
    .badge-imminent {
      background: rgba(239, 68, 68, 0.16);
      color: #ef4444;
      font-size: 0.85rem;
      font-weight: 900;
      padding: 6px 14px;
      border-radius: 8px;
      border: 1px solid rgba(239, 68, 68, 0.45);
      animation: pulse 1.5s infinite;
      white-space: nowrap;
    }

    /* 모집중 */
    .badge-open {
      background: rgba(16, 185, 129, 0.16);
      color: #34d399;
      font-size: 0.85rem;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 8px;
      border: 1px solid rgba(16, 185, 129, 0.4);
      white-space: nowrap;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.65; }
    }

    /* ==========================================================================
       RIGHT: 코드 칸 (파이썬 코드 편집 및 실행)
       ========================================================================== */
    .editor-wrapper {
      display: flex;
      flex-direction: column;
      flex: 1;
      height: 100%;
    }

    .editor-container {
      position: relative;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    #codeEditor {
      width: 100%;
      flex: 1;
      min-height: 380px;
      background: #060d1b;
      color: #f8fafc;
      font-family: 'Fira Code', 'Consolas', monospace;
      font-size: 0.98rem;
      line-height: 1.65;
      padding: 18px;
      border: 1px solid rgba(41, 71, 126, 0.6);
      border-radius: 14px;
      resize: vertical;
      outline: none;
      tab-size: 4;
      transition: var(--transition);
    }

    #codeEditor:focus {
      border-color: var(--gold-400);
      box-shadow: 0 0 15px rgba(229, 179, 49, 0.25);
    }

    /* 오류 안내 영역 */
    #errorBox {
      display: none;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.4);
      border-radius: 12px;
      padding: 16px 20px;
      margin-top: 16px;
      color: #fca5a5;
      font-size: 0.9rem;
      line-height: 1.6;
      animation: errorFade 0.2s ease forwards;
    }

    #errorBox strong {
      color: #ef4444;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
      font-size: 0.98rem;
    }

    @keyframes errorFade {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 푸터 */
    .lab-footer {
      background: #030812;
      border-top: 1px solid var(--navy-border);
      padding: 18px 24px;
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-gray-500);
    }
  </style>
</head>
<body>

  <!-- 맨 위 제목 띠: "스킬투머니 실습실 · 4장" -->
  <header class="lab-header">
    <div class="brand-group">
      <div class="logo-symbol">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="url(#goldGrad)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
          <defs>
            <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#fff2cc" />
              <stop offset="50%" stop-color="#e5b331" />
              <stop offset="100%" stop-color="#8c6411" />
            </linearGradient>
          </defs>
          <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6" />
        </svg>
      </div>
      <div class="lab-title-wrap">
        <h1 class="lab-title">스킬투머니 실습실 · 4장</h1>
        <span class="chapter-tag">파이썬 강좌 목록 반복문 실습</span>
      </div>
    </div>

    <!-- 헤더 우측: [처음 코드로], [⬇ 코랩 노트북으로 받기] -->
    <div class="header-actions">
      <button type="button" class="btn btn-navy-outline" id="btnReset">처음 코드로</button>
      <button type="button" class="btn btn-gold" id="btnDownload">⬇ 코랩 노트북으로 받기</button>
    </div>
  </header>

  <!-- 실습실 본문 (2열 분할 레이아웃) -->
  <main class="lab-workspace">
    <!-- 왼쪽 웹앱 화면 -->
    <section class="panel">
      <div class="panel-header">
        <div class="panel-title">
          <span class="panel-title-dot"></span>
          원데이 강좌 목록
        </div>
        <button type="button" class="btn btn-refresh" id="btnRefresh">
          🔄 목록 새로 고침
        </button>
      </div>
      <div class="panel-body">
        <p class="webapp-desc">
          파이썬 코드의 <code>print()</code> 출력이 실시간으로 원데이 강좌 카드로 변환되어 쌓입니다.
        </p>

        <!-- 카드가 쌓이는 자리 -->
        <div id="cardsContainer">
          <!-- print() 실행 결과가 카드로 동적 렌더링됩니다 -->
        </div>

    <!-- 오른쪽 코드 칸 -->
    <section class="panel">
      <div class="panel-header">
        <div class="panel-title">
          <span class="panel-title-dot"></span>
          파이썬 코드 (Python)
        </div>
        <button type="button" class="btn btn-gold" id="btnRun">
          ▶ 코드 실행하기
        </button>
      </div>
      <div class="panel-body editor-wrapper">

        </div>

        <!-- 오류 안내 영역 -->
        <div id="errorBox">

        </div>
      </div>
    </section>
  </main>

  <!-- 하단 안내 푸터 -->
  <footer class="lab-footer">
    © 2026 스킬투머니 (SkillToMoney) · 배운 기술을 돈으로 바꾸는 실전 파이썬 실습실
  </footer>

  <!-- ==========================================================================
       실습실 동작 스크립트 (Skulpt 엔진 + ch04_lab.ipynb 다운로드 + 카드 파서)
       ========================================================================== -->
  <script>
    // 오른쪽 코드 칸의 처음 코드 (요청하신 4장 정답 코드)
    const INITIAL_CODE = `names = ["AI 자동화", "숏폼 편집", "엑셀 실무"]
prices = [35000, 45000, 30000]
seats = [8, 6, 10]
booked = [8, 2, 7]
for i in range(0, 3, 1):
    left = seats[i] - booked[i]
    if left == 0:
        state = "[마감]"
    elif left <= 2:
        state = "[마감 임박]"
    else:
        state = ""
    print(names[i], prices[i], "원 / 남은 자리", left, "석", state)`;

    const codeEditor = document.getElementById("codeEditor");
    const cardsContainer = document.getElementById("cardsContainer");
    const errorBox = document.getElementById("errorBox");
    const errorMessage = document.getElementById("errorMessage");
    const btnReset = document.getElementById("btnReset");
    const btnDownload = document.getElementById("btnDownload");
    const btnRun = document.getElementById("btnRun");
    const btnRefresh = document.getElementById("btnRefresh");

    // 초기 코드 주입
    codeEditor.value = INITIAL_CODE;

    // 파이썬 print() 버퍼
    let printOutputLines = [];

    function outf(text) {
      if (text && text.trim().length > 0) {
        printOutputLines.push(text.trim());
      }
    }

    function builtinRead(x) {
      if (Sk.builtinFiles === undefined || Sk.builtinFiles["files"][x] === undefined) {
        throw "File not found: '" + x + "'";
      }
      return Sk.builtinFiles["files"][x];
    }

    // print() 한 줄을 강좌 카드 한 장으로 렌더링
    // 요구사항:
    // 1. 줄의 맨 앞 강좌 이름은 굵게
    // 2. "[마감]"은 회색 "마감" 표시
    // 3. "[마감 임박]"은 빨간 글씨로 표시
    function renderCardFromLine(line) {
      const card = document.createElement("div");
      card.className = "course-card";

      const isClosed = line.includes("[마감]");
      const isImminent = line.includes("[마감 임박]");

      if (isClosed) {
        card.classList.add("closed-card");
      }

      // 상태 태그 추출 후 순수 텍스트 정돈
      let cleanLine = line.replace("[마감 임박]", "").replace("[마감]", "").trim();

      // 강좌 이름, 수강료, 남은 자리 분리
      // 출력 형식: "AI 자동화 35000 원 / 남은 자리 0 석"
      let courseName = "";
      let priceText = "";
      let remainingSeatsText = "";

      const wonIndex = cleanLine.indexOf("원");
      if (wonIndex !== -1) {
        const frontPart = cleanLine.substring(0, wonIndex).trim();
        const backPart = cleanLine.substring(wonIndex).trim();

        const lastSpace = frontPart.lastIndexOf(" ");
        if (lastSpace !== -1) {
          courseName = frontPart.substring(0, lastSpace).trim();
          const rawPrice = frontPart.substring(lastSpace + 1).trim();
          const numPrice = Number(rawPrice);
          priceText = isNaN(numPrice) ? rawPrice + "원" : numPrice.toLocaleString() + "원";
        } else {
          courseName = frontPart;
        }

        // 남은 자리: "원 / 남은 자리 0 석"
        remainingSeatsText = backPart.replace(/^원\s*\/\s*/, "");
      } else {
        courseName = cleanLine;
      }

      // 상태 뱃지 구성
      let badgeHtml = "";
      if (isClosed) {
        // [마감]: 회색 "마감" 표시
        badgeHtml = `<span class="badge-closed">마감</span>`;
      } else if (isImminent) {
        // [마감 임박]: 빨간 글씨 표시
        badgeHtml = `<span class="badge-imminent">마감 임박</span>`;
      } else {
        badgeHtml = `<span class="badge-open">모집중</span>`;
      }

      card.innerHTML = `
        <div class="course-info">
          <div class="course-name">${courseName}</div>
          <div class="course-meta">
            ${priceText ? `<span class="course-price">${priceText}</span>` : ""}
            ${remainingSeatsText ? `<span class="course-seats">${remainingSeatsText}</span>` : ""}
          </div>
        </div>
        <div class="course-action">
          ${badgeHtml}
        </div>
      `;

      cardsContainer.appendChild(card);
    }

    // 오류 표시
    function showError(err) {
      errorBox.style.display = "block";
      errorMessage.textContent = err.toString();
    }

    // 파이썬 실행
    function runPython() {
      printOutputLines = [];
      cardsContainer.innerHTML = "";
      errorBox.style.display = "none";

      const prog = codeEditor.value;

      if (typeof Sk !== "undefined") {
        Sk.pre = "output";
        Sk.configure({
          output: outf,
          read: builtinRead,
          __future__: Sk.python3
        });

        const myPromise = Sk.misceval.asyncToPromise(function () {
          return Sk.importMainWithBody("<stdin>", false, prog, true);
        });

        myPromise.then(
          function () {
            if (printOutputLines.length === 0) {
              cardsContainer.innerHTML = `<div style="text-align: center; color: var(--text-gray-400); padding: 40px;">출력된 카드가 없습니다. print() 문을 확인해 주세요.</div>`;
              return;
            }
            printOutputLines.forEach(line => renderCardFromLine(line));
          },
          function (err) {
            showError(err);
          }
        );
      } else {
        // Skulpt CDN 오프라인 시 안전 폴백 인터프리터
        runFallbackInterpreter(prog);
      }
    }

    // 순수 JS 파이썬 시뮬레이터 (오프라인/네트워크 차단 환경 대응)
    function runFallbackInterpreter(code) {
      try {
        let names = ["AI 자동화", "숏폼 편집", "엑셀 실무"];
        let prices = [35000, 45000, 30000];
        let seats = [8, 6, 10];
        let booked = [8, 2, 7];

        const namesMatch = code.match(/names\s*=\s*\[(.*?)\]/);
        if (namesMatch) names = JSON.parse(`[${namesMatch[1].replace(/'/g, '"')}]`);

        const pricesMatch = code.match(/prices\s*=\s*\[(.*?)\]/);
        if (pricesMatch) prices = JSON.parse(`[${pricesMatch[1]}]`);

        const seatsMatch = code.match(/seats\s*=\s*\[(.*?)\]/);
        if (seatsMatch) seats = JSON.parse(`[${seatsMatch[1]}]`);

        const bookedMatch = code.match(/booked\s*=\s*\[(.*?)\]/);
        if (bookedMatch) booked = JSON.parse(`[${bookedMatch[1]}]`);

        cardsContainer.innerHTML = "";
        for (let i = 0; i < names.length; i++) {
          const left = (seats[i] || 0) - (booked[i] || 0);
          let state = "";
          if (left === 0) {
            state = "[마감]";
          } else if (left <= 2) {
            state = "[마감 임박]";
          }
          const outputLine = `${names[i]} ${prices[i]} 원 / 남은 자리 ${left} 석 ${state}`;
          renderCardFromLine(outputLine);
        }
      } catch (err) {
        showError(err);
      }
    }

    // [처음 코드로] 버튼 이벤트
    btnReset.addEventListener("click", () => {
      codeEditor.value = INITIAL_CODE;
      runPython();
    });

    // [코드 실행하기] & [목록 새로 고침] 이벤트
    btnRun.addEventListener("click", runPython);
    btnRefresh.addEventListener("click", runPython);

    // [⬇ 코랩 노트북으로 받기] -> 파일명 ch04_lab.ipynb
    btnDownload.addEventListener("click", () => {
      const code = codeEditor.value;
      const notebookData = {
        cells: [
          {
            cell_type: "markdown",
            metadata: {},
            source: [
              "# 스킬투머니 실습실 · 4장\n",
              "배운 기술이 돈이 되는 파이썬 원데이 강좌 목록 반복문 실습\n"
            ]
          },
          {
            cell_type: "code",
            execution_count: null,
            metadata: {},
            outputs: [],
            source: code.split("\n").map(line => line + "\n")
          }
        ],
        metadata: {
          colab: {
            name: "ch04_lab.ipynb",
            provenance: []
          },
          kernelspec: {
            display_name: "Python 3",
            name: "python3"
          },
          language_info: {
            name: "python"
          }
        },
        nbformat: 4,
        nbformat_minor: 0
      };

      const blob = new Blob([JSON.stringify(notebookData, null, 2)], {
        type: "application/json"
      });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "ch04_lab.ipynb";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });

    // 페이지를 열면 코드를 한 번 실행해 카드를 그려 줌
    window.addEventListener("DOMContentLoaded", () => {
      runPython();
    });
  </script>
</body>
